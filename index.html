<!DOCTYPE html>
<html>
  <head>
    <title>Games
    </title>
    
  </head>
  <style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #292929, #111);
  font-family: Arial, Helvetica, sans-serif;
  color: white;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 30px 15px;
}

/* Game Title */
h2 {
  font-size: 32px;
  text-align: center;
  letter-spacing: 2px;
  margin-bottom: 40px;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
}

/* Game Buttons */
.css-button {
  width: 140px;
  height: 140px;

  background: rgba(255, 255, 255, 0.05);
  border: 3px solid white;
  border-radius: 50%;

  margin: 10px;
  padding: 12px;

  cursor: pointer;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  transition: all 0.25s ease;
}

/* Hover Effect */
.css-button:hover {
  transform: translateY(-8px) scale(1.05);
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
}

/* Click Effect */
.css-button:active {
  transform: scale(0.92);
}

/* Images */
.image-height {
  width: 105px;
  height: 105px;

  object-fit: contain;
  border-radius: 50%;
}

/* Result */
.js-result {
  min-height: 35px;

  margin-top: 45px;
  margin-bottom: 15px;

  font-size: 28px;
  font-weight: bold;
  text-align: center;

  letter-spacing: 1px;
}

/* Move Information */
.js-move {
  min-height: 25px;

  font-size: 18px;
  color: #d5d5d5;

  text-align: center;
}

/* Score */
.score {
  margin-top: 30px;

  font-size: 20px;
  font-weight: bold;

  text-align: center;
}

/* Reset Button */
.css-score {
  margin-top: 25px;

  padding: 12px 25px;

  background: white;
  color: #191919;

  border: none;
  border-radius: 8px;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;

  transition: all 0.2s ease;
}

/* Reset Hover */
.css-score:hover {
  background: #e5e5e5;
  transform: translateY(-3px);
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
}

/* Reset Click */
.css-score:active {
  transform: translateY(0);
}

/* Mobile */
@media (max-width: 600px) {

  h2 {
    font-size: 24px;
    margin-bottom: 30px;
  }

  .css-button {
    width: 105px;
    height: 105px;
    margin: 5px;
  }

  .image-height {
    width: 80px;
    height: 80px;
  }

  .js-result {
    font-size: 23px;
    margin-top: 35px;
  }

  .score {
    font-size: 18px;
  }
}
  </style>
  <body>
    <h2>
      STONE | PAPER | SCISSORS -- GAME
    </h2>
    <button onclick="playGame('Rock');" class="css-button" ><img src="images/Rock.png" class="image-height"></button>

    <button onclick="playGame('Paper');" class="css-button"><img src="images/Paper.png" class="image-height"></button>


    <button onclick="playGame('Scissors');" class="css-button"><img src="images/Scissors.png" class="image-height"></button>


    <p class="js-result"></p>
    <p class="js-move"></p>
    <p class="js-score score"></p>
    

    <button onclick="score10();" class="css-score">Reset Score</button>
    
    <script >function calculateMoney(){

 }







 //this is simple way to refresh site without any saved state loss
 let score = JSON.parse(localStorage.getItem('score')) ||{
     wins:0,
     Lose:0,
     Tie:0
   };
 
 /* it is optional code for reresh
 if(score === null){
   score = {
     wins:0,
     Lose:0,
     Tie:0
   };
 }
 */
document.querySelector('.js-score')
 .innerHTML = `wins:${score.wins},Lose:${score.Lose},Tie:${score.Tie}`;

 function playGame(playerMove){

   const computerMove = pickComputerMove();
   

   let result = '';

   if(playerMove === 'Scissors'){
     if(computerMove === 'Rock'){
       result = 'You Lose.';
       
     }
     else if(computerMove === 'Scissors'){
       result = 'Tie.';
     }
     else if(computerMove === 'Paper'){
       result = 'You Won.';
     }


   }else if(playerMove === 'Paper'){

     if(computerMove === 'Rock'){
       result = 'You Won.';
       
     }
     else if(computerMove === 'Scissors'){
       result = 'You Lose.';
     }
     else if(computerMove === 'Paper'){
       result = 'Tie.';
     }


   }else if(playerMove === 'Rock'){

     if(computerMove === 'Rock'){
       result = 'Tie.';
       
     }
     else if(computerMove === 'Scissors'){
       result = 'You Won.';
     }
     else if(computerMove === 'Paper'){
       result = 'You Lose.';
     }
   }

   if(result === 'You Won.'){
     score.wins+=1;
   }else if(result === 'You Lose.'){
     score.Lose+=1;
   }else if(result === 'Tie.'){
     score.Tie+=1;
   } 
   

   

   document.querySelector('.js-result')
     .innerHTML = result;

   
   document.querySelector('.js-move')
   .innerHTML = `You <img src="images/${playerMove}.png" class="image-height">
   <img src="images/${computerMove}.png" class="image-height">Computer`;

   updatescore();
   

 
     

 }

 function pickComputerMove(){
   const RandomNumber = Math.random();
   let computerMove = '';

   if(RandomNumber>=0 && RandomNumber<1/3 )
   {
     computerMove = 'Rock' ;
   }
   else if( RandomNumber>=1/3 && RandomNumber<2/3){

     computerMove='Paper';
   }
   else if(RandomNumber >=2/3 && RandomNumber<1){
     computerMove='Scissors';
   }
   return computerMove;
 }

   score.wins=0;
score.Lose=0;

 function updatescore(){
   localStorage.setItem('score',JSON.stringify(score));
   //to show score and update    
       document.querySelector('.js-score')
       .innerHTML = `wins:${score.wins},Lose:${score.Lose},Tie:${score.Tie}`;

 </script>
